name: Label issues
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-labeler-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label:
    if: contains(github.event.issue.labels.*.name, 'bug') || contains(github.event.issue.labels.*.name, 'feature request')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Label the selected area and platform
        uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/issue-labeler.yml
          enable-versioned-regex: '0'
          include-title: '0'
          include-body: '1'
          sync-labels: '1'
