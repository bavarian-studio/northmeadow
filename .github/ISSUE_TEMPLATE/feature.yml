name: Feature request
description: Suggest a way to make Northmeadow more useful.
labels:
  - feature request
  - needs-triage
body:
  - type: markdown
    attributes:
      value: >
        **Before you post**


        These issues are intended to be public. Do not include customer data,

        note contents, names, or screenshots of mandates. Use invented examples

        and leave out passwords, recovery keys, tokens, and other secrets.


        For a security concern, use the [private reporting
        form](https://github.com/bavarian-studio/northmeadow/security/advisories/new)

        instead of opening an issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Choose the closest match, or Not sure.
      options:
        - Not sure
        - Install
        - Sign-in and devices
        - Mandates
        - Notes and editor
        - Search
        - Import
        - Agents and connector
        - Record
        - People and invitations
        - Sync
        - Self-hosted
        - Billing
        - Website and docs
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Choose the closest match, or Not sure.
      options:
        - Not sure
        - Windows
        - macOS
        - Linux
        - Web
        - iOS
        - Android
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task or difficulty using an invented example.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Your suggestion
      description: How would you like Northmeadow to help?
    validations:
      required: true
